name: Build

on: push

permissions:
  contents: write

jobs:
  build-windows-msi:
    name: Windows Build (MSI)
    runs-on: windows-2022
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win32_msvc2019
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Download Tools
        run: python scripts\download.py
      - name: Download OpenSSL
        shell: pwsh
        run: |
          # community.chocolatey.org can return a transient 504 (seen 2026-10-29);
          # the 1.1.1.2100 package itself still exists. Retry instead of failing
          # the whole job on one gateway timeout.
          $attempt = 0
          do {
            $attempt++
            choco install -y openssl --version=1.1.1.2100 --x86
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Write-Host "choco attempt $attempt/3 failed, retrying in 60s..."; Start-Sleep -Seconds 60 }
          } while ($attempt -lt 3)
          exit 1
      - name: Build MSI Package
        id: build
        shell: cmd
        run: |
          set "QTDIR=%QT_ROOT_DIR%"
          set "OPENSSL=C:\Program Files (x86)\OpenSSL-Win32"
          set PATH=%PATH%;C:\Program Files (x86)\WiX Toolset v3.11\bin
          call scripts\windows\packages\msi\build.msi.bat || exit
          set /p VERSION=<VERSION
          echo VERSION=%VERSION%>>%GITHUB_ENV%
      - name: Upload Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: apk-editor-studio_windows_${{ env.VERSION }}.msi
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitName: true
          omitBody: true
          prerelease: true
          tag: development
          token: ${{ secrets.GITHUB_TOKEN }}
  build-windows-zip:
    name: Windows Build (ZIP)
    runs-on: windows-2022
    steps:
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win32_msvc2019
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Download Tools
        run: python scripts\download.py
      - name: Download OpenSSL
        shell: pwsh
        run: |
          # community.chocolatey.org can return a transient 504 (seen 2026-10-29);
          # the 1.1.1.2100 package itself still exists. Retry instead of failing
          # the whole job on one gateway timeout.
          $attempt = 0
          do {
            $attempt++
            choco install -y openssl --version=1.1.1.2100 --x86
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Write-Host "choco attempt $attempt/3 failed, retrying in 60s..."; Start-Sleep -Seconds 60 }
          } while ($attempt -lt 3)
          exit 1
      - name: Build ZIP Package
        id: build
        shell: cmd
        run: |
          set "QTDIR=%QT_ROOT_DIR%"
          set "OPENSSL=C:\Program Files (x86)\OpenSSL-Win32"
          call "scripts\windows\packages\zip\build.zip.bat" || exit
          set /p VERSION=<VERSION
          echo VERSION=%VERSION%>>%GITHUB_ENV%
      - name: Upload Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: apk-editor-studio_windows_${{ env.VERSION }}.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitName: true
          omitBody: true
          prerelease: true
          tag: development
          token: ${{ secrets.GITHUB_TOKEN }}
  build-linux-appimage:
    name: Linux Build (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        # ubuntu-20.04 is retired, so this job never got a runner. The old
        # beineri/opt-qt-5.15.2-focal PPA only ships packages for Focal
        # (20.04), so it cannot be kept on a newer runner: use Ubuntu 22.04's
        # system Qt 5.15 instead. No qt515-env.sh sourcing is needed;
        # find_package(Qt5) finds the system Qt. libfuse2 is required for
        # linuxdeployqt's AppImage to run on 22.04+.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev libgl1-mesa-dev libsecret-1-dev libfuse2 adb zipalign
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Download Tools
        run: python3 scripts/download.py
      - name: Build AppImage Package
        id: build
        run: |
          scripts/linux/packages/appimage/build.appimage.sh
          echo "VERSION=$(cat VERSION)" >> $GITHUB_ENV
      - name: Upload Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: scripts/linux/packages/appimage/apk-editor-studio_linux_${{ env.VERSION }}.AppImage
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitName: true
          omitBody: true
          prerelease: true
          tag: development
          token: ${{ secrets.GITHUB_TOKEN }}
  build-macos:
    # Formerly the separate build-macos-arm64 workflow. Intel (x86_64) support
    # is dropped: this job is arm64-only, on macos-15 with Homebrew's native
    # arm64 Qt 5 (qt@5). The old macos-13 / install-qt-action x86_64 Qt path
    # is gone; do not restore it without also restoring an Intel runner.
    name: macOS Build arm64 (APP, DMG)
    runs-on: macos-15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Install Qt 5 (arm64, Homebrew)
        # qt@5 is deprecated upstream (Homebrew disable date 2027-05-19).
        # The deprecation warning is expected until this project migrates
        # to Qt 6; do not switch to `brew install qt` (Qt 6) without porting.
        run: |
          brew install qt@5 cmake
          echo "QT_PREFIX=$(brew --prefix qt@5)"
          "$(brew --prefix qt@5)/bin/qmake" --version
          uname -m

      - name: Download Tools
        run: python3 scripts/download.py

      - name: Raise deployment target for arm64
        # CMakeLists.txt FORCE-sets CMAKE_OSX_DEPLOYMENT_TARGET to 10.13,
        # which is invalid for arm64 (arm64 needs macOS 11+). Patch it
        # in the checkout only; this does not touch the upstream repo.
        run: |
          perl -i -pe 's/"10\.13"/"11.0"/' CMakeLists.txt
          grep -n 'CMAKE_OSX_DEPLOYMENT_TARGET' CMakeLists.txt

      - name: Build APP
        # lib/QtKeychain/CMakeLists.txt still says cmake_minimum_required(VERSION 3.3);
        # CMake 4 (shipped on macos-15 runners) removed compatibility with
        # CMake < 3.5, so configure fails there without this flag. The flag is the
        # fix CMake's own error message suggests; it does not change any source.
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"
          cmake --build build --config Release

      - name: Verify arm64 binary
        run: |
          APP="build/apk-editor-studio.app"
          test -x "$APP/Contents/MacOS/apk-editor-studio"
          echo "Executable archs: $(lipo -archs "$APP/Contents/MacOS/apk-editor-studio")"
          test "$(lipo -archs "$APP/Contents/MacOS/apk-editor-studio")" = "arm64"
          echo "QtCore archs: $(lipo -archs "$APP/Contents/Frameworks/QtCore.framework/QtCore" 2>/dev/null || echo "QtCore not bundled here")"

      - name: Ad-hoc sign embedded libraries
        # Homebrew's Qt (and its dependencies) are ad-hoc signed. macdeployqt
        # rewrites LC_ID_DYLIB / LC_RPATH with install_name_tool, which
        # invalidates those signatures. macOS 15+ dyld then SIGKILLs the
        # process at launch: EXC_BAD_ACCESS / "Code Signature Invalid"
        # (CODESIGNING, Invalid Page), before main() runs.
        # Re-sign every Mach-O except the main executable. That binary is
        # already linker-signed, and Contents/MacOS also contains non-code
        # files (resources, tools) so sealing the bundle fails. adb and
        # zipalign already have valid signatures and are left alone.
        run: |
          APP="build/apk-editor-studio.app"
          MAIN="$APP/Contents/MacOS/apk-editor-studio"
          while IFS= read -r -d '' f; do
            if [ "$f" = "$MAIN" ]; then
              continue
            fi
            if file -b "$f" | grep -q 'Mach-O'; then
              if ! codesign --verify "$f" >/dev/null 2>&1; then
                codesign --force --sign - "$f"
              fi
            fi
          done < <(find "$APP" -type f -print0)
          codesign --verify --verbose=2 "$APP/Contents/Frameworks/QtCore.framework/Versions/5/QtCore"
          codesign --verify --verbose=2 "$APP/Contents/Frameworks/QtWidgets.framework/Versions/5/QtWidgets"
          codesign --verify --verbose=2 "$APP/Contents/Frameworks/QtGui.framework/Versions/5/QtGui"
          codesign --verify --verbose=2 "$APP/Contents/PlugIns/platforms/libqcocoa.dylib"

      - name: Package APP (ZIP)
        run: |
          VERSION="$(cat VERSION)"
          mv build/apk-editor-studio.app "APK Editor Studio.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "APK Editor Studio.app" \
            "apk-editor-studio_macos-arm64_${VERSION}.app.zip"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Package DMG
        run: |
          # appdmg's config expects the .app under scripts/macos/packages/app/
          cp -R "APK Editor Studio.app" scripts/macos/packages/app/
          npm i appdmg
          (cd scripts/macos/packages/dmg && npx appdmg "appdmg/config.json" "apk-editor-studio_macos_${VERSION}.dmg")
          mv "scripts/macos/packages/dmg/apk-editor-studio_macos_${VERSION}.dmg" \
             "apk-editor-studio_macos-arm64_${VERSION}.dmg"

      - name: Upload Assets
        uses: ncipollo/release-action@v1
        with:
          artifacts: apk-editor-studio_macos-arm64_${{ env.VERSION }}.app.zip,apk-editor-studio_macos-arm64_${{ env.VERSION }}.dmg
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitName: true
          omitBody: true
          prerelease: true
          tag: development
          token: ${{ secrets.GITHUB_TOKEN }}
